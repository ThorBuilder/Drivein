name: DriveIn
options:
  bundleIdPrefix: com.drivein
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  DriveIn:
    type: application
    platform: iOS
    sources:
      - path: DriveIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drivein.app
        PRODUCT_NAME: DriveIn
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: DriveIn
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: DriveIn uses your speed to unlock video only when the car is parked.
        NSMotionUsageDescription: DriveIn uses motion data to tell when you are driving, so video can pause for safety.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes:
          - youtube
          - nflx
          - aiv
          - disneyplus
          - hbomax
          - max
          - videos
          - twitch
          - plex
          - spotify
          - youtubemusic
          - music
          - podcasts
